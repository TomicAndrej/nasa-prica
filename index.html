<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4a1526">
  <title>За моју Микицу ❤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&family=Caveat:wght@500;600&display=swap&subset=latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== EKRAN SA ŠIFROM ===================== -->
  <section id="brava" aria-label="Unos šifre">
    <div class="srca-pozadina" aria-hidden="true"></div>
    <div class="brava-sadrzaj">
      <div class="katanac" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56">
          <path d="M20 28v-8a12 12 0 0 1 24 0v8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <rect x="12" y="28" width="40" height="28" rx="7" fill="currentColor"/>
          <path d="M32 47.5c-.4 0-5.5-3.3-5.5-6.6a3 3 0 0 1 5.5-1.6 3 3 0 0 1 5.5 1.6c0 3.3-5.1 6.6-5.5 6.6z" fill="#4a1526"/>
        </svg>
      </div>
      <h1 class="brava-naslov">Ово је само за моју Микицу</h1>
      <p class="brava-podnaslov">Унеси своју шифру</p>

      <div class="tackice" id="tackice" aria-live="polite">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="brava-poruka" id="bravaPoruka">&nbsp;</p>

      <div class="tastatura" id="tastatura">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <span></span><button data-k="0">0</button>
        <button data-k="del" class="obrisi" aria-label="Obriši">⌫</button>
      </div>
    </div>
  </section>

  <!-- ===================== ALBUM ===================== -->
  <main id="album" hidden>
    <div class="napredak" aria-hidden="true"><div id="napredakTraka"></div></div>
    <div id="strane"></div>
  </main>

  <!-- Skriveni element iz kog se pravi PDF pisma -->
  <div id="pdfIzvor" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script src="sadrzaj.js"></script>
  <script src="app.js"></script>
</body>
</html>
